 IRE_owen_sheehy_skeffington_sic_desc: "§YBorn:§! §LMay 19th, 1909, in Dublin, Co. Dublin, Ireland§!\n§YAlso known as:§! §L$IRE_owen_sheehy_skeffington_alt$§!\n§YBackground:§! §LThe son of pacifist, feminist socialists, Owen Sheehy-Skeffington has been raised to champion social justice as a cause. When his father, a non-combatant, was murdered during the Easter Rising, it radicalised his mother and deepened her critical view of the world. Imbued with his mother's perspective and an impeccable progressive education, it did not take Owen long at all to burst onto the Irish political scene. Originally a member of the Labour Party, Sheehy-Skeffington began, alongside many others, to chafe against a leadership, in their minds, made increasingly meak and timid by the constant threat of red scare tactics. This would eventually come to a head when younger members broke off to form the Progressive Labour Party, which Sheehy-Skeffington effectively leads.§!"
 IRE_william_obrien_sic_desc: "§YBorn:§! §LJanuary 23rd, 1881, in Clonakilty, Co. Cork, Ireland§!\n§YAlso known as:§! §L$IRE_william_obrien_alt$§!\n§YBackground:§! §LThe stern face of democratic socialism in Ireland, trade union boss and labour leader William O'Brien sincerely believes that working class interests in the fledgling republic are better served by the ballot box than the barrel of a gun. Although this has made him persona non grata to radical Syndicalists, O'Brien is acutely aware of how conservative Ireland remains beneath the surface, and his strategy is as much pragmatic as it is ideological.§!"
 IRE_michael_donnellan_sic_desc: "§YBorn:§! §LFebruary 6th, 1900, in Dunmore, Co. Galway, Ireland§!\n§YAlso known as:§! §L$IRE_michael_donnellan_alt$§!\n§YBackground:§! §LMichael Donnellan had been for the past decade and a half, a steady but relatively lowkey presence in Irish local politics as a Sinn Féin councillor in rural Galway. However, growing increasingly discontent with Sinn Féin's agricultural policies, Donnellan would split off from the party and break out as a leader of Clann na Talmhan, the farmer's party. Very much a populist, Donnellan's politics are all about pitting the hard-working farmers against the \"greedy elites\".§!"
 IRE_eamon_de_valera_sic_desc: "§YBorn:§! §LOctober 14th, 1882, in New York City, New York, United States of America§!\n§YBackground:§! §LHaunted by the spectre of being written off as the \"nearly man\" of Irish history, one-time Sinn Féin leader Éamon de Valera possesses a need and drive for power that is rarely, if ever, matched by others. He is determined to embed his personal legacy on the state beyond the revolutionary era, sometimes to the detriment of his decision-making.§!"
 IRE_eoin_oduffy_sic_desc: "§YBorn:§! §LJanuary 28th, 1890, near Castleblayney, Co. Monaghan, Ireland§!\n§YAlso known as:§! §L$IRE_eoin_oduffy_alt$§!\n§YBackground:§! §LA strongman, a demagogue, a generalissimo, Eoin O'Duffy has been the rallying point for an entire cohort of hardline Irish traditionalists and cultural supremacists who were vehemently in favour of Irish independence, but not for the \"Liberal state\" that followed it, nor the international trading ties developed to support it.\nWhile Sinn Féin translates as \"We Ourselves\", O'Duffy and his followers would align more with the less favoured translation, \"Ourselves Alone\", and that proclaims that was always the true spirit of the independence movement. For all their talk of isolationism and an inward-facing culture, paradoxically O'Duffy and his followers are clearly influenced by authoritarian movements on the European continent, and corporatism in particular.§!"
 IRE_eoin_oduffy_cursed_sic_desc: "$IRE_eoin_oduffy_sic_desc$\n§gHowever, after an unexpected alliance with Éamon de Valera, O'Duffy has been seen to legitimise the supposedly constitutional nature of his party, and now as Príomh Aire serves as the right-hand man to his old boss' greatest rival — for now, at least.§!"
 IRE_gearoid_o_cuinneagain_sic_desc: "§YBorn:§! §LJanuary 2nd, 1910, in Belfast, Co. Antrim, Ireland§!\n§YAlso known as:§! §LGerald Cunningham§!\n§YBackground:§! §LIn an age of chaos, only those capable of demonstrating absolute force of will be able to reshape the world, at least that's how Ó Cuinneagáin would see it. Born as John Gerald Cunningham, Ó Cuinneagáin radicalised both politically and culturally in his youth, leading him to studying the rise of Totalism intensely, and concluded he has no qualms about their methods, only their end goals. Fanatical about bringing about a pure Irish-speaking, Christian and Gaelic Ireland, Ó Cuinneagáin will pursue his goals with hammer and tongs, with emphasis on the hammer.§!"
 IRE_george_gilmore_sic_desc: "§YBorn:§! §LMay 5th, 1898, in Howth, Co. Dublin, Ireland§!\n§YAlso known as:§! §L$IRE_george_gilmore_alt$§!\n§YBackground:§! §LDespite his origins in a conservative, Protestant unionist home in Dublin, George Gilmore has been one of Ireland's hardest-line left-wing radicals since his youth. A veteran of the War of Independence, Gilmore was amongst those who rejected the Anglo-Irish Treaty, and insisted that the revolution was not going far enough to reorganise Ireland. The syndicalist revolutions in Britain and France further cemented his views, and he has been positively champing at the bit ever since to break capitalism in Ireland. Having spent numerous years in prison for his activities, Gilmore has no difficulty sitting alongside the most hard-bitten cadres of militants.§!"
 IRE_roddy_connolly_sic_desc: "§YBorn:§! §LFebruary 11th, 1901, in Dublin, Co. Dublin, Ireland§!\n§YAlso known as:§! §L$IRE_roddy_connolly_alt$§!\n§YBackground:§! §LThe son of the martyred socialist revolutionary James Connolly, Roddy Connolly carries on his shoulders a considerable legacy. Moulded by the politics of his father, Connolly at all times holds fast to Syndicalist orthodoxy and his father's idea of the \"triple lock\": One Big Union, One Big Militia, One Big Party. Unconvinced that Irish nationalism can be wrested out of the hands of reactionaries, Connolly believes the road to a workers' republic has to be paved in collaboration with syndicalist allies internationally, not just domestically, a view reinforced by time spent studying in the Commune of France.§!"
 IRE_robert_n_tweedy_desc_body: "Robert \"Robin\" Naudin Tweedy is a low-level, somewhat enigmatic figure amongst the Irish left. Formerly an engineer in the British Army, Tweedy can be found active in trade union circles and various other left-wing committees, in addition to being by far the most senior figure in the otherwise youthful leadership of the Progressive Labour Party. Additionally, Tweedy is an expert in fuel sources, having published articles on the use of industrial alcohol as a fuel, and later becoming interested in using turf from Ireland's own peat pogs as a petrol substitute. He has a number of ideas in creating other sources of fuel for Ireland's vehicles, that he would like to offer a receptive government."
 IRE_james_dillon_advisor_desc: "§YBorn:§! §LSeptember 26th, 1902, in Dublin, Co. Dublin, Ireland§!\n§YAlso known as:§! §L$IRE_james_dillon_alt$§!\n§YBackground:§! §L$IRE_james_dillon_desc_body$ Although Dillon would clearly be an asset to a larger party, the NDP has pulled off something of a coup by managing to recruit him to their ranks.§!"
 IRE_winifred_carney_advisor_desc: "§YBorn:§! §LDecember 4th, 1887, in Bangor, Co. Down, Ireland§!\n§YAlso known as:§! §L$IRE_winifred_carney_alt$§!\n§YBackground:§! §LOnce known as the \"Typist with the Webley\", Carney was James Connolly's personal aide-de-camp during his life and during the Easter Rising. As the \"Red right-hand\" of arguably Irish Syndicalism's most important figure, Carney's credibility amongst the Irish hard left is as strong as anyone's, and is only limited by her own tendency to seek to be rank-and-file, rather than an outright leader. Nonetheless, she is a committed radical deeply involved in the trade unions.§!"
 IRE_bill_gannon_advisor_desc: "§YBorn:§! §LJune 23rd, 1902, in Dublin, Co. Dublin, Ireland§!\n§YAlso known as:§! §L$IRE_bill_gannon_alt$§!\n§YBackground:§! §LTo his enemies, Bill Gannon is a cutthroat, a thug and above-all-else, an assassin. Following the War of Independence, Gannon was linked by Irish intelligence to several murders connected to Anti-Treaty Sinn Féin against proponents of the treaty. However, enough conclusive evidence was never found to convict him, nor could the location of the shadowy Gannon always be ascertained. Gannon has continued to be involved with radical syndicalism in Ireland, and is closely associated with Saor Éire.§!"
 IRE_rosamond_jacob_advisor_desc: "§YBorn:§! §LOctober 13th, 1888, in Waterford, Co. Waterford, Ireland§!\n§YAlso known as:§! §L$IRE_rosamond_jacob_alt$§!\n§YBackground:§! §LA doggedly active feminist, historian and writer, Rosamond Jacob processes a boundless energy which, some have suggested, would have earned her greater fame and rewards if only she were a man. An Irish patriot deeply motivated to seeking equality amongst the classes as well as amongst the sexes, Jacob's Quaker background has influenced her to advocate for non-violent direct action where possible.§!"
 IRE_richard_corish_advisor_desc: "§YBorn:§! §LSeptember 17th, 1886, in Wexford, Co. Wexford, Ireland§!\n§YAlso known as:§! §L$IRE_richard_corish_alt$§!\n§YBackground:§! §LCorish is amongst the cohort in Labour who support the cautious approach taken by William O'Brien as far as the positioning of the party goes. Although considering himself a socialist, Corish is also a deeply devout Catholic who is keenly aware of the clergy's readiness to engage in a red scare, with French anti-clericalism having so thoroughly shaken the priesthood in previous decades. For Corish, socialism cannot be rammed through, but must come by the consent of the people.§!"
 IRE_william_norton_advisor_desc: "§YBorn:§! §LNovember 2nd, 1900, in Abbotstown, Co. Dublin, Ireland§!\n§YAlso known as:§! §L$IRE_william_norton_alt$§!\n§YBackground:§! §LNorton is a socialist who believes in food price controls, widows' pensions, orphans' allowances, state-built homes for the poor, and welfare for the unemployed. But he is also shrewd enough to know that in Ireland, you don't achieve those things by singing the Internationale in front of the clergy. Norton's approach is to paint Labour's ideal economy as one advocated by Scandinavian or German social democratic parties, and certainly not the French or British.§!"
 IRE_joseph_blowick_advisor_desc: "§YBorn:§! §LMarch 13th, 1903, in Belcarra, Co. Mayo, Ireland§!\n§YAlso known as:§! §L$IRE_joseph_blowick_alt$§!\n§YBackground:§! §LSix feet tall, twenty-two stone, if a horn is blown and a shout is thrown, the voice is instantly known: bellowing Joseph Blowick leading the charge for rural Ireland. Like an imposing Gaelic Chieftain brought forth to the modern era, Blowick is almost like a caricature of a rural strongman and can always be counted upon to advocate for the interests of farmers.§!"
 IRE_john_hayes_advisor_desc: "§YBorn:§! §LNovember 11th, 1887, in Murroe, Co. Limerick, Ireland§!\n§YAlso known as:§! §L$IRE_john_hayes_alt$§!\n§YBackground:§! §LFather John Hayes is the charismatic chief organiser of Muintir na Tíre, a highly popular rural development organisation run outside of political party lines. Hayes, born in absolute poverty in rural Limerick, founded Muintir na Tíre in order to give rural people decent opportunities to live and work without having to migrate. With Hayes at the helm, hundreds of branches have flourished all across Ireland.§!"
 IRE_rupert_guinness_advisor_desc: "§YBorn:§! §LMarch 29th, 1874, in London, England§!\n§YAlso known as:§! §L$IRE_rupert_guinness_alt$§!\n§YBackground:§! §LRupert Guinness is the scion of the Guinness brewing family, and now wields their considerable political and economic influence. Born and raised in London, he was a member of the British Army for a time and active in British politics pre-Revoution. Post-Revolution, Rupert and the rest of his family were amongst the Anglo-Irish \"bourgeoisie\" desperately glad to be able to retreat to their Irish holdings. To his credit, he is an innovative businessman who was able to recoup losses in Britain by opening new Guinness breweries outside of Ireland for the first time. Steeled by his family's experiences in the new Britain, Guinness now offers firmly capitalist-minded expertise.§!"
 IRE_michael_tierney_advisor_desc: "§YBorn:§! §LSeptember 20th, 1894, in Castleblakeney, Co. Galway, Ireland§!\n§YAlso known as:§! §L$IRE_michael_tierney_alt$§!\n§YBackground:§! §LThe university academic Michael Tierney has set himself a rather unwieldy task; to intellectualise the combined Irish corporatist and integralist movements that are so often characterised by street violence, dogmatic Catholicism and wild rhetoric rather than scholarly discussion. Nevertheless, Tierney advocates that these ideologies are the best means of practically achieving the tenants of social justice called for by successive Popes.§!"
 IRE_roy_c_geary_advisor_desc: "§YBorn:§! §LApril 11th, 1896, in Dublin, Co. Dublin, Ireland§!\n§YAlso known as:§! §L$IRE_roy_c_geary_alt$§!\n§YBackground:§! §LRobert \"Roy\" Charles Geary is a civil servant from Dublin possessing a masterful command of statistics. He attended University College Dublin, and became supportive of Arthur Griffith after the Easter Rising, but never entered political life. As a fluent French speaker and Francophile since his university days, Geary is saddened at the animosity between the opposing French regimes, yet has never outwardly stated any support for either. Holding a Doctorate of Science, Geary is the author of dozens of internationally-recognised publications on the interdisciplinary fields of mathematics, statistics and economics, and is regularly called upon to give advice to the government.§!"
 IRE_ernest_walton_advisor_desc: "§YBorn:§! §LOctober 6th, 1903, in Dungarvan, Co. Waterford, Ireland§!\n§YAlso known as:§! §L$IRE_ernest_walton_alt$§!\n§YBackground:§! §LHis continued residence in his native Ireland might surprise some, given the demand for his talents abroad, but nevertheless, the fact is that Ernest Walton is amongst the foremost nuclear physicists in the world. Treasured for his ability to present extremely complex concepts in simple and easy-to-understand terms, Walton is the pride of Trinity College Dublin's physics department.§!"
 NIR_basil_brooke_desc_mid: "Every aspect of Brooke's life, be it his religion, his politics or his career, originally rested on resisting Irish nationalism. However, following the unimaginable events of the 1920s"
 IRE_army_chief_upgrade_tt: "§GPromeut§! en §Y$army_chief$§! :"
 IRE_navy_chief_upgrade_tt: "§GPromeut§! en §Y$navy_chief$§! :"
 IRE_air_chief_upgrade_tt: "§GPromeut§! en §Y$air_chief$§! :"
 IRE_high_command_upgrade_tt: "§GPromeut§! en §Y$high_command$§! :"
 IRE_william_obrien_change_trait_tt: "§Y$IRE_william_obrien$§! : Remplace le trait §Y$IRE_dedicated_unioniser$§! par §Y$IRE_president_name_only$§!\nChangement effectif :\n$MODIFIER_STABILITY_FACTOR$ : §R-15.00%§!"
 IRE_slaves_of_slaves_tt: "§Y$IRE_hanna_sheehy_skeffington$§! :\nModifie le trait §Y$KR_passionate_feminist$§! par\n$MODIFIER_CONSCRIPTION_FACTOR$ : §G+5%§!\n$MODIFIER_RESEARCH_SPEED_FACTOR$ : §G+5.00%§!"
 IRE_gateway_to_the_atlantic_decisions: "Porte de l'Atlantique"
 IRE_gateway_to_the_atlantic_decisions_desc: "Ce bras de fer offre aux dirigeants irlandais une excellente occasion de négocier des opportunités d'affaires et des accords commerciaux avec les deux puissances navales, au bénéfice de l'économie du pays. Toutefois, si l'on n'y prend pas garde, la croissance de l'influence étrangère pourrait sonner le glas de la souveraineté irlandaise, et le contrôle politique de la nation deviendrait simplement le jouet des bienfaiteurs de l'Irlande...\n\nLes @GER §g[GER.GetName]§! ont actuellement §Y[?GER.IRE_gateway_influence]§! points.\nLes @ENG §R[ENG.GetName]§! ont actuellement §Y[?ENG.IRE_gateway_influence]§! points.\n\n$IRE_gateway_desc_ending$"
 IRE_gateway_desc_ending: "Si l'un des deux camps a §Y15 ou plus§! points d'influence de plus que l'autre à la fin de ce concours, @IRE l'§GIrlande§! deviendra leur §Ymarionnette§!, attirant l'île dans leur sphère d'influence."
 IRE_gateway_desc_ending_pp: "Dans le cas contraire, l'Irlande restera indépendante, et l'Allemagne et la Grande-Bretagne recevront chacune £pol_power §Y10§! pour chaque temps investi dans le concours."
 IRE_favour_a_side_GER: "Courtiser [GER.GetNameDef]"
 IRE_favour_a_side_GER_desc: "Depuis la fondation de la République d'Irlande, les gouvernements successifs ont lentement mais sûrement développé une bonne volonté à l'égard des Allemands. Le développement des relations entre nos deux pays passe simplement par la poursuite de cette politique, qui est facile à mettre en place."
 IRE_favour_a_side_ENG: "Courtiser [ENG.GetNameDef]"
 IRE_favour_a_side_ENG_desc: "Bien que les relations entre Irlandais et Britanniques aient toujours été pour le moins délicates, l'émergence des deux pays en tant que républiques révolutionnaires offre des opportunités jamais explorées auparavant. Si l'on part de zéro, peut-être est-il possible de construire une relation nouvelle et totalement inédite ?"
 IRE_gateway_to_the_atlantic_decisions_GER: "Porte de l'Atlantique"
 IRE_gateway_to_the_atlantic_decisions_GER_desc: "À la suite de l'incident du LÉ Macha, l'Union britannique a intensifié ses efforts pour fomenter une agitation socialiste en Irlande. Il est crucial pour les intérêts diplomatiques, financiers et stratégiques de l'Allemagne qu'une nation du bloc mitteleuropéen ne tombe pas dans la vague croissante du syndicalisme et, à cette fin, nous devons nous assurer complètement, par la promotion d'influences germanophiles dans le pays, que la République d'Irlande reste amicale envers le Reichspakt.\n\n§CNous§! avons actuellement §Y[?GER.IRE_gateway_influence]§! points.\nLes @ENG §R[ENG.GetAdjective]§! ont actuellement §Y[?ENG.IRE_gateway_influence]§! points.\n\n$IRE_gateway_desc_ending$\n$IRE_gateway_desc_ending_pp$"
 GER_pressure_ireland: "Pression de [From.GetNameDef]"
 GER_pressure_ireland_desc: "Un peuple aussi conservateur que les Irlandais ne semble pas susceptible d'être attiré par la cause syndicaliste, mais sa proximité avec la Grande-Bretagne et sa taille relative le rendent néanmoins vulnérable.\n\nIl est tout à fait possible que les Irlandais se rallient à nous par choix, mais la seule façon de s'assurer qu'ils ne sont pas attirés par les Britanniques est d'utiliser notre propre influence politique et économique sur l'île et son peuple."
 GER_pressure_ireland_NOT_blocked: "Nous ne sommes pas en train d'augmenter activement notre influence avec §Y[From.GetNameWithFlag]§!"
 GER_pressure_ireland_guns: "Équiper l'IRA"
 GER_pressure_ireland_guns_desc: "L'armée républicaine irlandaise (IRA) compte de nombreux alliés fidèles de l'Allemagne, depuis que nous avons financé sa rébellion il y a une vingtaine d'années. Nous devons veiller à ce qu'ils soient bien équipés, au cas où nous aurions besoin d'eux, et leur rappeler qui sont leurs amis."
 GER_pressure_ireland_cp: "Organiser des exercices de formation parrainés"
 GER_pressure_ireland_cp_desc: "Bien qu'elle se soit inspirée de notre régime d'entraînement militaire de classe mondiale, l'IRA reste une force dépassée et souvent irrégulière. En proposant d'entraîner ses forces sous la forme d'un exercice conjoint amical, nous aurons l'occasion de les préparer à prendre le contrôle de la situation en cas de besoin."
 GER_pressure_ireland_xp: "Liaison avec des agents irlandais compréhensifs"
 GER_pressure_ireland_xp_desc: "De nombreux officiers de l'IRA sont mécontents de leur gouvernement actuel, mais pas suffisamment pour passer à l'action. En rencontrant ces officiers et en leur promettant notre soutien, nous nous assurerons qu'ils seront à notre disposition le moment venu."
 IRE_gateway_to_the_atlantic_decisions_ENG: "Porte de l'Atlantique"
 IRE_gateway_to_the_atlantic_decisions_ENG_desc: "Bien que nous n'ayons aucun désir de coloniser l'Irlande comme l'ont fait les impérialistes au cours des siècles passés, il est impératif pour le maintien du commerce britannique et de la sécurité nationale que l'État irlandais ne tombe pas sous l'emprise teutonne, car un tel événement permettrait à l'île de servir de base ennemie si une nouvelle Weltkrieg devait éclater.\n\n§CNous§! avons actuellement §Y[?ENG.IRE_gateway_influence]§! points.\nLes @GER §g[GER.GetAdjective]s§! ont actuellement §Y[?GER.IRE_gateway_influence]§! points.\n\n$IRE_gateway_desc_ending$\n$IRE_gateway_desc_ending_pp$"
 ENG_pressure_ireland: "Pression de [From.GetNameDef]"
 ENG_pressure_ireland_desc: "Nos rapports nous informent que la quasi-totalité des dirigeants politiques irlandais préféreraient qu'ils restent en dehors de toute alliance militaire formelle et qu'ils continuent à interagir de manière indépendante avec nous-mêmes et le continent, à partir d'une position de neutralité.\n\nEn réalité, leur politique conservatrice et leur appartenance à la Mitteleuropa font qu'il est dangereusement possible qu'ils soient totalement piégés par les Allemands, qu'ils le veuillent ou non, et que ce n'est qu'en exerçant notre propre influence que nous pourrons donner plus de pouvoir aux socialistes irlandais et empêcher cette catastrophe."
 ENG_pressure_ireland_NOT_blocked: "Nous ne sommes pas en train d'augmenter activement notre influence avec §Y[From.GetNameWithFlag]§!"
 ENG_pressure_ireland_guns: "Équiper l'ICA"
 ENG_pressure_ireland_guns_desc: "L'armée des citoyens irlandais (ICA) est une force dévouée, qui peut devenir utile avec le soutien adéquat. Les équiper clandestinement sera vital pour leur révolution et pour les garder de leur côté."
 ENG_pressure_ireland_cp: "Liaison avec les exilés socialistes irlandais"
 ENG_pressure_ireland_cp_desc: "Le socialisme en Irlande a longtemps souffert de la répression gouvernementale, ce qui a poussé de nombreux dirigeants et sympathisants à s'exiler, notamment en Grande-Bretagne. Rencontrer ces exilés et leur faire part de nos projets contribuera grandement à assurer la légitimité de notre régime lorsqu'il sera mis en place."
 ENG_pressure_ireland_xp: "Organiser des régimes d'entraînement clandestins"
 ENG_pressure_ireland_xp_desc: "L'ICA est composée de nombreuses nouvelles recrues peu entraînées, en raison de l'interdiction de rassemblement public de leurs rangs. Nous devons fournir une formation par tous les moyens possibles afin de nous assurer que, le moment venu, ces hommes se révéleront être des soldats et changeront leur pays pour le meilleur."
 IRE_toggle_gateway_repeat_decisions: "[IRE_loc_repeat_decisions] Achèvement automatique de la pression de [From.GetNameDef]"
 IRE_toggle_gateway_repeat_decisions_GER_desc: "Cette décision peut faire basculer la décision $IRE_gateway_repeat_decisions_name$ pour qu'elle se répète automatiquement une fois terminée. L'influence [Root.GetAdjective] augmente de 5 points tous les 10 jours, et le coût $MODIFIER_CONSUMER_GOODS_FACTOR$ est appliqué en continu."
 IRE_toggle_gateway_repeat_decisions_ENG_desc: "$IRE_toggle_gateway_repeat_decisions_GER_desc$"
 IRE_gateway_repeat_decisions_name: "Pression de [From.GetNameDef]"
 IRE_gateway_repeat_decisions_tt: "§YPendant que cette mission est active :§!\n§W$MODIFIER_CONSUMER_GOODS_FACTOR$ :§! §Y15.0%§!"
 IRE_gateway_repeat_decisions_GER_desc: "$GER_pressure_ireland_desc$\n\n$IRE_gateway_repeat_decisions_tt$"
 IRE_gateway_repeat_decisions_ENG_desc: "$ENG_pressure_ireland_desc$\n\n$IRE_gateway_repeat_decisions_tt$"
 IRE_gateway_repeat_decisions_enable_tt: "La décision §Y$IRE_gateway_repeat_decisions_name$§! sera automatiquement répétée une fois terminée."
 IRE_gateway_repeat_decisions_disable_tt: "La décision §Y$IRE_gateway_repeat_decisions_name$§! ne sera pas automatiquement répétée une fois terminée."
 IRE_gateway_long_countdown_desc: "$IRE_gateway_IRE_ending_year_tt$\n\n§YEffets pendant l'activité :§!\n§W$MODIFIER_STABILITY_WEEKLY$ :§! §R-0.12%§!"
 IRE_GER_gateway_long_countdown: "$IRE_gateway_long_countdown$"
 IRE_GER_gateway_long_countdown_desc: "$IRE_gateway_ending_year_tt$"
 IRE_ENG_gateway_long_countdown: "$IRE_gateway_long_countdown$"
 IRE_ENG_gateway_long_countdown_desc: "$IRE_gateway_ending_year_tt$"
 IRE_gateway_short_countdown: "La crise du Nord"
 IRE_gateway_short_countdown_desc: "Des années d'antagonisme accumulé dans la province d'Ulster entre catholiques et protestants ont fait place à une hostilité ouverte, faisant s'écrouler la stabilité que le gouvernement irlandais cherchait à maintenir. Alors que le pays traverse une période de troubles, la possibilité qu'une puissance étrangère exploite cette situation par l'intermédiaire de sympathisants irlandais pour parvenir à ses propres fins est devenue une préoccupation pressante. Plus que jamais, nous devons nous méfier des étrangers qui se mêlent de nos affaires.\n\n$ireland_events.1022.tt$\n\n§YEffets en cours d'utilisation :§!\n§W$MODIFIER_STABILITY_WEEKLY$ :§! §R-0.50%§!"
 IRE_GER_gateway_short_countdown: "Le gouvernement irlandais en crise"
 IRE_GER_gateway_short_countdown_desc: "Bien que les Irlandais se soient montrés amicaux envers l'Allemagne depuis leur indépendance, la nation a commencé à connaître de graves troubles en raison d'un conflit ethno-religieux interne. L'armée irlandaise contient de nombreux éléments germanophiles et, avec notre soutien, elle sera heureuse de rétablir la stabilité et d'amener le pays dans la sphère allemande. Toutefois, si nous n'y prenons pas garde, les Britanniques pourraient profiter du chaos pour étendre leur soi-disant "révolution ouvrière" à l'île.\n\n$ireland_events.1022.tt$"
 IRE_ENG_gateway_short_countdown: "$IRE_GER_gateway_short_countdown$"
 IRE_ENG_gateway_short_countdown_desc: "Avec les bouleversements qui s'étendent dans l'État réactionnaire irlandais en raison de luttes intestines ethno-religieuses, l'Union britannique, après des années d'assistance secrète aux socialistes irlandais, dispose enfin d'une ouverture pour les aider à renverser leurs oppresseurs nationalistes bourgeois. Cependant, nous ne devons pas laisser passer cette occasion, de peur de permettre à leur gouvernement de se rétablir, ou pire, aux Allemands de profiter de ce moment pour obtenir une base navale et aérienne à côté de notre île.\n\n$ireland_events.1022.tt$"
 IRE_if_elec_sf: "§aSinn Féin§!\n\nEn cas de victoire, le §aSinn Féin§! poursuivra son accord de confiance et d'approvisionnement avec le §OUlster Democratic Party§!"
 ireland_events.12.d1: "$ireland_events.12.d$\n\nSurmontant ces obstacles, les efforts rapides et décisifs du gouvernement sur les deux fronts semblent avoir porté leurs fruits. Les renflouements accordés aux agriculteurs ont permis de maîtriser l'impact de la perte des recettes d'exportation, le Parti démocratique d'Ulster et la population loyaliste continuent de soutenir l'administration actuelle en tant que rempart contre le syndicalisme et le nationalisme pur et dur, et les rapports des solliciteurs locaux ont révélé qu'en dépit des circonstances, le soutien de la population irlandaise au Sinn Féin reste élevé.\n\nBien que l'opinion publique soit généralement satisfaite de la manière dont le Sinn Féin a maîtrisé le "lundi noir", les problèmes persistants concernant la fermeture des entreprises, les expulsions, le chômage et la question récurrente des privilèges de l'Ulster continuent d'être un sujet brûlant dans les discours et la propagande de l'opposition en vue des prochaines élections.\n\nToutefois, l'excellente gestion de la crise par le gouvernement signifie que le scénario de la réélection de Michael Collins à la présidence est désormais une possibilité très probable, et les principaux députés d'An Saorstáit Críostúil ont laissé entendre en privé que, si le moment l'exigeait, ils pourraient être disposés à coopérer temporairement avec le Sinn Féin et même avec l'UDP pour le bien commun de la République irlandaise."
 ireland_events.2012.d.start: "L'Europe était autrefois le point névralgique de l'émigration irlandaise, mais lorsque les perspectives pour les Irlandais se sont assombries sur le continent au XIXe siècle, les Britanniques, dans leur domination post-napoléonienne, ayant fait pression sur les puissances européennes pour qu'elles dissolvent leurs brigades irlandaises, les États-Unis d'Amérique, république fondée en rébellion contre l'Empire, sont devenus le nouveau point névralgique de l'émigration irlandaise. Bien qu'ils aient été confrontés à de nombreux problèmes d'intégration au début, ils sont rapidement devenus un élément essentiel de la société américaine et la lutte des Irlandais doit beaucoup aux efforts des Irlando-Américains. La guerre de Sécession a marqué un tournant décisif dans l'acceptation de la nation américaine, puisque de nombreux Irlandais, dont de célèbres révolutionnaires irlandais, ont combattu pour l'Union et, dans une bien moindre mesure, pour la Confédération.\n\nPour la deuxième fois en moins de soixante-quinze ans, les fils de l'Irlande, quelles que soient leurs couleurs, se retrouvent dans chaque tranchée américaine. Les Walsh des uns abattent les Kelly des autres. Il s'agit véritablement d'une guerre de frères. Alors que l'Amérique avait promis aux Irlandais de mettre fin à leurs problèmes, notre peuple se sent aujourd'hui obligé d'offrir la même chose aux Américains. Avec ou sans le soutien du gouvernement, le peuple irlandais viendra certainement en aide à l'Amérique."
