 IRE_arigna_gaelicised: "Airgnigh"
 IRE_john_j_okelly_sic_desc: "§YNaissance :§! §L7 juillet 1872, sur l'île de Valentia, Co. Kerry, Irlande§!\n§YPseudonyme :§! §L$IRE_john_j_okelly_alt$§!\n§YCarrière :§! §L$IRE_john_j_okelly_advisor_desc_body$\n\nAprès la consolidation de son régime grâce à O'Duffy et l'expulsion des éléments les plus instables de l'AN, le fidèle traditionaliste O'Kelly était un choix évident pour un poste de commandant en second fiable.§!"
 IRE_john_j_okelly_cursed_sic_desc: "§YNaissance :§! §L7 juillet 1872, sur l'île de Valentia, Co. Kerry, Irlande§!\n§YPseudonyme :§! §L$IRE_john_j_okelly_alt$§!\n§YCarrière :§! §L$IRE_john_j_okelly_advisor_desc_body$\n\nCompte tenu de la déradicalisation et de la normalisation combinées d'Aontas Náisiúnta après son mandat en tant que membre d'un gouvernement de coalition, l'ancien président du Sinn Féin anti-traité était un choix évident comme chef de parti pour succéder au regretté général O'Duffy.§!"
 IRE_patrick_a_mulcahy_air_chief_desc: "§YNaissance :§! §L4 novembre 1897, à Waterford, Co. Waterford, Irlande§!\n§YAlias :§! §L$IRE_patrick_a_mulcahy_alt$§!\n§YCarrière :§! §LMulcahy est un nom familier à tous les membres de l'Armée républicaine irlandaise, même si, pour l'armée de l'air, l'identité de son auteur n'est pas aussi évidente qu'ailleurs. Comme son frère aîné Richard, Patrick Anthony Mulcahy est né à Waterford et a commencé une carrière à un jeune âge dans le service postal, plus précisément en tant que télégraphiste. En 1915, il s'est engagé dans l'armée britannique en tant que sapeur du génie royal, a combattu en France et, après la guerre, a refusé une promotion recherchée dans la RAF, choisissant plutôt de retourner en Irlande et de rejoindre l'IRA. Comme son frère, il est resté dans l'IRA après l'indépendance et a depuis joué un rôle de premier plan dans sa formation en tant qu'armée professionnelle.\nAprès la révolution britannique, Mulcahy a reconsidéré le poste qu'il avait refusé dans la RAF et a commencé à regarder vers le haut. On ne peut certainement pas l'accuser de vivre dans l'ombre de ses frères, car si les deux hommes se consacrent à la liberté et à la protection de l'Irlande, le jeune Mulcahy ne se préoccupe guère de la politique en question. Il se préoccupe uniquement du développement de la petite armée de l'air irlandaise pour en faire une force dynamique et évolutive, et cherche à s'assurer que ses méthodes se développent constamment, bien au-delà du niveau et des connaissances atteints lors de la Weltkrieg.§!"
 IRE_mitteleuropa_member: "§Y[Root.GetNameWithFlag]§! est membre de la §YMitteleuropa§!"
 IRE_IEDC_member: "§Y[Root.GetNameWithFlag]§! est membre de l'§YIEDC§!"
 IRE_gateway_decisions_GER_desc: "À la suite de l'incident de LÉ Macha, l'Union britannique a intensifié ses efforts pour attiser l'agitation socialiste en Irlande. Il est crucial pour les intérêts diplomatiques, financiers et stratégiques de l'Allemagne qu'aucune nation du bloc Mitteleuopa ne succombe à la vague montante du syndicalisme ; à cette fin, nous devons veiller, par la promotion d'influences germanophiles au sein du pays, à ce que la République d'Irlande reste favorable au Reichspakt.\n\n§CNous§! disposons actuellement de §Y[?GER.IRE_gateway_influence]§! points.\nLes @ENG §R[ENG.GetAdjective]§! disposent actuellement de §Y[?ENG.IRE_gateway_influence]§! points.\n\n$IRE_gateway_decisions_desc_ending$\n$IRE_gateway_decisions_desc_ending_pp$"
 ireland_events.1000.d.IRE: "Même si le Lundi Noir a provoqué de nombreux problèmes, le gouvernement espérait prudemment que la crise resterait le seul problème majeur à régler pendant la reprise du pays. Pourtant, il aurait du savoir que le destin se moque bien des espérances. Hier vers 11 h 27, le navire de la marine irlandaise LÉ Macha est entré en collision soudaine par le dessous, à plusieurs milles au large de Waterford. Il s'est avéré qu'il avait heurté le RNS Thetis, appartenant à l'Union britannique et naviguant en dehors des eaux territoriales britanniques. Immergé en mer, le sous-marin était resté invisible pendant que le LÉ Macha passait au dessus jusqu'à ce que, suite à une mauvaise décision de son capitaine, le sous-marin a refait surface en éperonnant le Macha.\n\nAucun des deux n'a heureusement subi de dommages sérieux et les deux navires ainsi que leur équipage ont été sauvés grâce à une opération de sauvetage conjointe organisée par le service naval irlandais et la marine britannique. Cette coopération audacieuse a été saluée par les partisans d'une détente comme le début d'un possible réchauffement des relations anglo-irlandaises. Ceux-ci ne représentent pourtant qu'une minorité et tant le public que le gouvernement s'interrogent sur la présence d'un sous-marin britannique dans les eaux territoriales irlandaises. Des rumeurs infâmes n'ont d'ailleurs pas tardé à se répandre et déjà l'on parle un peu partout de complots militaro-syndicalistes.\n\nCes préoccupations sont partagées par l'Empire allemand, qui a fermement condamné l'incident. Le Reichskanzler lui-même a prononcé aujourd'hui un discours au Reichstag, dans lequel il dénonce l'agression syndicaliste, et a chargé le représentant allemand à Dublin de garantir le soutien continu de l'empire si l'Union britannique tentait d'étendre encore son influence. De hauts diplomates, bien que reconnaissants du soutien allemand, ont cependant conseillé la prudence pour ne pas risquer de s'engager sur le chemin de la vassalité vis à vis de l'Allemagne. Les intérêts nationaux irlandais consistent, selon eux, à trouver une voie médiane entre les deux puissances et à récolter progressivement les fruits de l'amitié tout en garantissant que ce qui est le mieux pour l'Irlande ne soit pas subordonné aux intérêts des grandes puissances."
 ireland_events.1000.d.GER: "Hier, vers 11 h 27, un navire militaire de la République d'Irlande nommé LÉ Macha, a été soudainement percuté par le sous-marin britannique RNS Thetis à plusieurs milles au large de la ville côtière irlandaise de Waterford, dans les eaux territoriales irlandaises. Bien qu'un sauvetage conjoint ait permis de sauver les deux bateaux sans perdre de vie, les diplomates britanniques se sont montrés exceptionnellement méfiants quant aux raisons entourant la présence du navire à cet endroit.\n\nL'Empire allemand et la République d'Irlande entretiennent une forte amitié depuis la Weltkrieg, l'Allemagne ayant été parmi les premières nations à reconnaître l'indépendance irlandaise et a joué un rôle important dans l'armement des rebelles irlandais contre leurs suzerains britanniques. Bien qu'ils soient restés associés à l'Empire britannique, les révolutionnaires britanniques ont oeuvré pour l'établissement d'un commerce important avec le pays insulaire et son éventuelle entrée dans la Mitteleuropa, après le traité anglo-irlandais. Aux yeux de nos milieux d’affaires et des services de renseignement, cet incident apparemment mineur n’est que le début d’une offensive britannique contre l’influence teutonique sur l’île."
 ireland_events.1051.d.collins: "$ireland_events.1051.d.sfmain$\n\n$ireland_events.1051.d.sfcollinsstart$ a choisi d'œuvrer à l'amélioration des conditions de vie des catholiques, tout en offrant des compensations monétaires aux loyalistes afin d'atténuer les pressions en faveur de la réforme. Si la perte de sièges pour ses partenaires de l'UDP en raison de l'abolition de l'article C et les perceptions de faiblesse des loyalistes à l'égard du parti peuvent nuire au Sinn Féin, sa volonté de se sacrifier pour le bien de la nation irlandaise et de son peuple lui a permis de regagner les éloges et le respect d'un public qui avait commencé à se lasser du Big Fellow."
 ireland_events.1051.d.mulcahy: "$ireland_events.1051.d.sfmain$\n\nRichard Mulcahy et son gouvernement n'ont pas tardé à profiter de ce moment, en soutenant Cahir Healy et la Ligue nationale pour les libertés civiles en tant qu'alternative modérée à l'extrême droite, dans un effort pour regagner le soutien des catholiques, tout en lançant des mesures de répression contre les éléments militants dans la province. Bien que la persistance du charcutage électoral reste une source de ressentiment, les promesses de Mulcahy de travailler avec la NLCL et ses partenaires de l'UDP pour obtenir des améliorations en matière de logement et d'emploi ont réussi à servir de baume contre la radicalisation, tandis que les compensations monétaires accordées aux loyalistes serviront à atténuer la pression en faveur de la réforme."
 ireland_events.1053.t: "L'Heure du Changement"
 ireland_events.1053.d: "Un an s'est écoulé depuis le règlement de la Crise du Nord, et les appels en faveur de la négociation d'une solution à long terme se poursuivent, afin d'empêcher qu'un tel événement ne se reproduise.\n\nLa solution la plus évidente pour y parvenir serait de repenser en profondeur la composition de l'État — en tenant compte de manière bien plus exhaustive des conséquences potentielles, par rapport à ce qui avait été envisagé lorsque le Nord a rejoint le reste du pays lors de la Révolution britannique. À l'époque, la menace d'une invasion syndicaliste imminente avait nécessité la conclusion d'un accord élaboré à la hâte, mais l'occasion se présente aujourd'hui de corriger cette erreur.\n\nUne nouvelle Constitution, la première depuis l'indépendance, rédigée avec la contribution de tous les partis, y compris l'UDP, est désormais considérée comme une nécessité politique."
 ireland_events.1053.a: "Nous devons répondre à l'appel du peuple."
 ireland_events.2015.d.nodemocracy: "$ireland_events.2015.d.start$ une junte militaire dirigée par le général [ARG.GetLeader] qui a rétabli la démocratie en Argentine pour l'anéantir à nouveau lorsque le gouvernement élu a refusé de négocier avec [FOP.GetNameDef]. Ses actions erratiques ont suscité quelques froncements de sourcils, mais il est généralement soutenu par ceux qui s'opposent à l'avancée du syndicalisme.\n\n$ireland_events.2015.d.end$"
 ireland_events.2608.d5: "$ireland_events.2608.d.start$ Cependant, avec l'établissement d'une véritable République irlandaise socialiste, le nouveau gouvernement, contrairement aux réactionnaires qui entretenaient des rancunes sectaires pour détourner l'attention du prolétariat de ses véritables ennemis, a réussi à unir les travailleurs catholiques et protestants, qui ne sont plus pris à la gorge par le nationalisme bourgeois et l'impérialisme.\n\n$ireland_events.2608.d.nonan$ L'Irlande a été jetée sous le bus et la résistance de Dublin a diminué à la fois par la force et par la persuasion. $ireland_events.2608.d.nonan2$ qui ont fait tomber les hommes de la propriété et $ireland_events.2608.d.nonan3$"
 ireland_events.3500.b.tt: "§YLe drapeau national sera remplacé par la Charrue Étoilée.§!"
 ireland_events.3500.b.ENG.tt: "§YLe drapeau irlandais sera remplacé par la Charrue Etoilée.§!"
 ireland_flavour_events.388.d: "Aujourd'hui, Leinster House a résonné de nombreuses félicitations. Grâce à l'excellent travail du Ministère des Affaires étrangères, l'accès de l'Irlande à une source d'énergie vitale est à présent assuré. Comme ce combustible n'était pas présent naturellement en Irlande, il ne pouvait être obtenu qu'en important des pays beaucoup plus proches de l'équateur, et cette ressource était si importante que beaucoup se demandaient comment tant de secteurs industriels avaient pu s'en passer dans le passé, compte tenu de la façon dont ils dépendaient désormais de ce liquide sombre.\n\nLe thé. "La seule bonne chose que les Britanniques nous ont jamais laissée" a vu sa popularité littéralement exploser. Sa popularité est telle que la demande irlandaise par habitant dépasse désormais celle de ses voisins. Introduit par l’ancienne classe dirigeante britannique il y a plus de cent ans, son usage s’est répandu au fil du temps parmi le reste de la population.\n\nTraditionnellement, les Britanniques s'approvisionnaient en feuilles auprès de leurs colonies du sous-continent indien, l'Union s'approvisionnant désormais de la même manière auprès de ses propres alliés indiens. Bien que l’accès à cette source semble stable pour nous, pour l’instant, des rumeurs prudentes ont déterminé qu’il ne serait pas judicieux de s’en remettre uniquement à elle, si le commerce venait à être perturbé à l’avenir.\n\nAinsi, un petit groupe de diplomates irlandais a passé les derniers mois à parcourir le monde, à visiter des plantations et à négocier des accords d'importation, pour finalement déterminer que mélanger du thé Assam indien avec le thé plus foncé et plus disponible au Kenya, sous contrôle allemand, produirait un excellente bière robuste, adaptée au marché intérieur. En réduisant la dépendance du pays à l'égard de sources exclusivement indiennes potentiellement peu fiables et en diversifiant les mélanges utilisés, les résultats ont permis d'obtenir à la fois un thé au meilleur goût et un accès plus sûr aux importations pour les années à venir."
 IRE_naval_college: "Créer l'École navale de [GetVictoryPointName_7394]"
 IRE_naval_college_desc: "À l'heure actuelle, bon nombre de nos officiers suivent une formation à l'étranger, qui reste toutefois assez rudimentaire. Afin de former des officiers parfaitement rompus à la guerre navale, nous allons créer une école navale près de notre principale base navale à [GetVictoryPointName_7394]. Cette école permettra de former des diplômés qui connaissent bien les réalités du combat en mer et qui sont capables de diriger correctement les marins placés sous leurs ordres."
 IRE_republic_maintained_EOD: "Mettre Fin à l'Expérience Libérale"
 IRE_republic_maintained_EOD_desc: "Le Sinn Féin, les laquais de Valera, le Parti travailliste crypto-syndicaliste… tous ces partis nous ont démontré l'échec de la soi-disant démocratie libérale. Notre république doit être préservée, en éradiquant tout syndicalisme, et si cela fait obstacle aux "réformes" et aux "droits", qu'il en soit ainsi."
 IRE_dem_conscription_focus: "Au Nom de la République"
 IRE_dem_conscription_focus_desc: "Si nous voulons protéger notre république, nous devons mobiliser le plus grand nombre possible de soldats pour la défendre. Il est démontré depuis longtemps qu’une armée de conscrits bien armée constitue un moyen efficace de dissuader les envahisseurs, tout en garantissant qu’une partie importante de la population bénéficie d’une formation militaire."
 IRE_FOP_volunteers_desc: "Prenant le nom de Bernardo O'Higgins, descendant de la noblesse irlandaise devenu le leader le plus important de la lutte pour l'indépendance du Chili, une brigade de volontaires a été formée pour aider le Chili et le Front Ouvrier Patagonien dans leur lutte contre le gouvernement de Buenos Aires."
