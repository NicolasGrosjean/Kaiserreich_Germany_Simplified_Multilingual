 ireland_events.5600.d: "Cela détermine si un coup d'État d'Aontas Náisiúnta se produira sur les vainqueurs non-Sinn Féin de l'élection, et si Aontas Náisiúnta visera finalement à aller vers PatAut ou NatPop (cela affectera les choix d'orientation et d'autres). O'Duffy peut encore perdre le jeu d'influence et perdre le pouvoir. Le drapeau est effacé une fois que la voie d'O'Duffy est décidée."
