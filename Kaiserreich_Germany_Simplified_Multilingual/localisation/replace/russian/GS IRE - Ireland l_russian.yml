 ireland_events.5650.t: "1941 Election Result"
 ireland_events.5650.d: "This determines who will be intended to win the '41 election (and will effect what focuses the AI will do in the first term). This flag is removed at end of the Gateway to the Atlantic if Aontas Náisiúnta or socialists are in charge, or at the election."
