 ireland_events.5700.t: "Irish Foreign Policy"
 ireland_events.5700.d: "This determines what foreign policy path the AI will aim for, and for purposes of volunteers. The flag is removed if Germany or Britain win the Gateway to the Atlantic."
 ireland_events.5700.a: "Neutral"
 ireland_events.5700.b: "Reichspakt"
 ireland_events.5700.c: "Entente"
 ireland_events.5750.t: "Gateway to the Atlatic Result"
 ireland_events.5750.d: "This determines who will win the Gateway to the Atlantic for the AI. The flag is removed after the influence game ends."
