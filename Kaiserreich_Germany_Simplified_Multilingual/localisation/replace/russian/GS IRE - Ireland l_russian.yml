 ireland_events.5600.t: "Aontas Náisiúnta Political Path"
 ireland_events.5600.d: "This determines if an Aontas Náisiúnta coup will happen on the non-Sinn Féin winners of the election, and if Aontas Náisiúnta will eventually aim to go either PatAut or NatPop (it will effect focus choices and others). O'Duffy can still lose the influence game and lose power. The flag is cleared after O'Duffy's path is decided."
 ireland_events.5600.a: "No coup"
 ireland_events.5600.b: "Parliamentary AN"
