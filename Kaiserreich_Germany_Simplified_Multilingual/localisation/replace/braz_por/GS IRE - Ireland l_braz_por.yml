l_braz_por:
 IRE_arigna_gaelicised: "An Airgnigh"
 IRE_john_j_okelly_sic_desc: "§YBorn:§! §LJuly 7th, 1872, on Valentia Island, Co. Kerry, Ireland§!\n§YAlso known as:§! §L$IRE_john_j_okelly_alt$§!\n§YBackground:§! §L$IRE_john_j_okelly_advisor_desc_body$\n\nFollowing O'Duffy's solidification of his regime, and the expulsion of the most unstable elements of AN, the stalwart traditionalist O'Kelly was the obvious choice for a reliable second in command.§!"
 IRE_john_j_okelly_cursed_sic_desc: "§YBorn:§! §LJuly 7th, 1872, on Valentia Island, Co. Kerry, Ireland§!\n§YAlso known as:§! §L$IRE_john_j_okelly_alt$§!\n§YBackground:§! §L$IRE_john_j_okelly_advisor_desc_body$\n\nGiven the combined de-radicalisation and normalisation of Aontas Náisiúnta following their term in office as members of a coalition government, the former president of Anti-Treaty Sinn Féin was an easy choice of party leader to follow the late General O'Duffy.§!"
 IRE_patrick_a_mulcahy_air_chief_desc: "§YBorn:§! §LNovember 4th, 1897, in Waterford, Co. Waterford, Ireland§!\n§YAlso known as:§! §L$IRE_patrick_a_mulcahy_alt$§!\n§YBackground:§! §LMulcahy is a name that will be familiar to everyone in the Irish Republican Army, though for the Air Corps, who it refers to is not the same foregone conclusion as elsewhere. Like his older brother Richard, Patrick Anthony Mulcahy was born in Waterford and started a career at a young age in the postal service, specifically as a telegrapher. In 1915 he joined the British Army as a sapper with the Royal Engineers, fought in France, and after the war declined a sought-after promotion to the RAF, opting instead to return to Ireland and join the IRA. Like his brother, he stayed in the IRA after independence, and has since undertaken a senior role in its formation as a professional army.\nAfter the British Revolution, Mulcahy reconsidered the position he previously turned down in the RAF, and began to look upwards. He can certainly not be accused of living in his brothers' shadow, as while both men are dedicated to Irelands' freedom and protection, the younger Mulcahy pays little heed to the politics in question. He is solely concerned with the development of Ireland's small Air Corp into a dynamic, evolving force, and seeks to ensure that its methods are constantly developing far past the standard and knowledge that was reached in the Weltkrieg.§!"
 IRE_mitteleuropa_member: "§Y[Root.GetNameWithFlag]§! is a member of §YMitteleuropa§!"
 IRE_IEDC_member: "§Y[Root.GetNameWithFlag]§! is a member of the §YIEDC§!"
 IRE_gateway_decisions_GER_desc: "In the wake of the LÉ Macha Incident, the Union of Britain has intensified its efforts to foment socialist agitation in Ireland. It is crucial to German diplomatic, financial and strategic interests that a nation of the Mitteleuropean bloc does not fall to the growing tide of syndicalism, and to this end we must completely ensure via the promotion of Germanophile influences within the country, that the Irish Republic remains friendly to the Reichspakt.\n\n§CWe§! currently have §Y[?GER.IRE_gateway_influence]§! points.\nThe @ENG §R[ENG.GetAdjective]§! currently have §Y[?ENG.IRE_gateway_influence]§! points.\n\n$IRE_gateway_decisions_desc_ending$\n$IRE_gateway_decisions_desc_ending_pp$"
 ireland_events.1000.d.IRE: "Though Black Monday brought much turmoil, it was cautiously hoped by the government that the crisis would remain the only major issue on their plate as the country recovered. Yet fate is rarely so kind. Yesterday at approximately 1127 hours, the Irish naval vessel LÉ Macha experienced a sudden collision from underneath, fifty-eight miles off the coast of Waterford. As it turned out, she happened to collide with the RNS Thetis, belonging to the Union of Britain and situated outside of British territorial waters. Submerged in the sea, the submarine went unseen as the LÉ Macha sailed over it until, owing to the poor decision-making of the captain, the submarine surfaced, ramming the Macha.\n\nFortunately neither incurred serious damage, both vessels along with their crew being saved by a joint rescue effort organised by the Irish Naval Service and the British Navy. This bold cooperation has been heralded as the beginning of a possible warming in Anglo-Irish relations by advocates of a détente, albeit such sentiments stay firmly in the minority as the public and government alike anxiously question the purpose for which a British submarine trespassed in Irish territorial waters in the first place, hysteric tales of nefarious syndicalist plots already being churned out by the rumour mill.\n\nThese significant concerns are shared by the German Empire, who have strongly condemned the incident, the Reichskanzler making a speech in the Reichstag today denouncing syndicalist aggression, and the German minister to Dublin has promised us of the empire's continued backing should the Union of Britain attempt to expand their influence. However senior diplomats, although grateful for German support, have counselled caution, warning of the risk of sleepwalking into German vassaldom. In their view Irish national interests lie in steering a middle course between the two powers, reaping the benefits of friendship with both while ensuring that what's best for Ireland is not subordinated to the needs of the great powers."
 ireland_events.1000.d.GER: "Yesterday at approximately 1127 hours, a naval ship of the Irish Republic, named the LÉ Macha, was suddenly rammed by the British submarine RNS Thetis, fifty-eight miles off the coast of the Irish coastal city of Waterford, well within Irish territorial waters. Although rescue efforts ensured both boats were saved and no lives lost, British diplomats have proven to be exceptionally cagey as to the purpose of the vessel's trespassing.\n\nThe German Empire and the Irish Republic have enjoyed a strong friendship since the Weltkrieg, as Germany was among the first to recognise Irish independence and played a significant role in arming the Irish rebels against their British overlords, and while they remained associated with the British Empire after the Anglo-Irish Treaty, the British Revolution saw the establishment of substantial trade with the island country and their eventual entry into Mitteleuropa. In the eyes of our business community and intelligence services, this seemingly minor incident is merely the beginning of a British assault on Teutonic influence on the isle."
 ireland_events.1051.d.collins: "$ireland_events.1051.d.sfmain$\n\n$ireland_events.1051.d.sfcollinsstart$ opted to work to improve Catholic conditions, while offering monetary compensation to loyalists in order to smooth over the push for reform. While a loss in seats for his UDP partners due the abolition of Article C and perceptions of weakness from loyalists towards the party may harm Sinn Féin, his willingness to sacrifice for the good of the Irish nation and its people has regained him the praise and respect of a public which had begun to tire of the Big Fellow."
 ireland_events.1051.d.mulcahy: "$ireland_events.1051.d.sfmain$\n\nRichard Mulcahy and his cabinet were swift to avail of this moment, backing Cahir Healy and the National League for Civil Liberties as a moderate alternative to the far-right in an effort to win back Catholic support, while launching crackdowns on militant elements in the province. Though the persisting presence of gerrymandering continues to be a source of resentment, Mulcahy's promises to work with the NLCL and his UDP partners to achieve improvements in housing and employment has succeeded in serving as a salve against radicalisation, while monetary compensation for loyalists shall serve to smooth over the push for reform."
 ireland_events.1053.t: "The Time for Change"
 ireland_events.1053.d: "A year has passed since the resolution of the Northern Crisis, and calls remain ongoing for a long-term solution to be negotiated, to prevent anything of the like from happening again.\n\nThe most obvious solution to manage this would be a thorough re-imagining of the composition of the state — a much more comprehensive consideration of the potential outcomes, compared with what was envisaged when the north joined the rest of the country during the British Revolution. At that time, the threat of an imminent syndicalist invasion necessitated a more hastily put-together agreement, but now the opportunity can be taken to correct this mistake.\n\nA new Constitution, the first since independence, composed with input from all parties including the UDP, is now seen as a political necessity."
 ireland_events.1053.a: "We must heed the peoples' calls."
 ireland_events.2015.d.nodemocracy: "$ireland_events.2015.d.start$ a military junta led by General [ARG.GetLeader] which, in a bizarre turn of events, restored Argentine democracy just to extinguish it once again when the elected government failed to negotiate with the Patagonian Workers Front. His erratic actions have raised some eyebrows, but he is generally supported by those who oppose the advance of syndicalism.\n\n$ireland_events.2015.d.end$"
 ireland_events.2608.d5: "$ireland_events.2608.d.start$ However, with the establishment of a true, socialist, Irish Republic, the new government, unlike the reactionaries who fostered sectarian grudges to keep the proletariat distracted from their real enemies, has been successful in uniting Catholic and Protestant workers, no more at each other's throats due to bourgeois nationalism and imperialism.\n\n$ireland_events.2608.d.nonan$ thrown under the bus and the latter's resistance to Dublin decreasing through both force and persusasion. $ireland_events.2608.d.nonan2$ who have brought down the men of property and $ireland_events.2608.d.nonan3$" # Socialists
 ireland_events.3500.b.tt: "§YThe national flag will be changed to the Starry Plough.§!"
 ireland_events.3500.b.ENG.tt: "§YThe Irish flag will be changed to the Starry Plough.§!"
 ireland_flavour_events.388.d: "Today Leinster House has been brimming with the sounds of much back-slapping and relieved congratulations. Through the fine work of the Department of Foreign Affairs, Ireland's access to a vital source of energy had been secured. As this fuel was not found naturally in Ireland, it could only be obtained by importing from countries much closer to the equator, and so important was this resource, that many wondered how so many industrial sectors had managed without it in the past, given how reliant they are now on the rich, dark liquid it produced.\n\nTea. \"The only good thing the British ever left us with\", as has been murmured about the peoples' love of the beverage. Such is its popularity that per capita, Irelands' demand now outstrips its neighbours. Introduced by the old British ruling class well over a hundred years ago, its usage diffused among the rest of the population in time.\n\nTraditionally, the British had gained their supply of the leaf from their colonies on the Indian subcontinent, with the Union now obtaining similarly from their own Indian allies. While access to this source for ourselves seems steady, for now, cautious whispers determined that it would be unwise to solely rely on it, should the trade be disrupted in the future.\n\nAs such, a small group of Irish diplomats had spent the last few months travelling the world, visiting plantations and negotiating importation deals, finally determining that mixing some Indian Assam tea with the darker, stronger tea available in German-held Kenya, would produce an excellent robust brew, suitable for the domestic market. By decreasing the country's reliance on potentially unreliable solely Indian sources, and diversifying the blends used, the results have meant both a better tasting tea, and more secure access to imports for the years to come."
 IRE_naval_college: "Establish the [GetVictoryPointName_7394] Naval College"
 IRE_naval_college_desc: "Currently many of our officers receive training overseas, and even then it is rather rudimentary. In order to train officers properly versed in naval warfare, we will create a naval college near our main naval base in [GetVictoryPointName_7394]. This will begin turning out graduates who are well versed in the realities of combat at sea, and are able to lead the sailors under their command properly."
 IRE_republic_maintained_EOD: "End the Liberal Experiment"
 IRE_republic_maintained_EOD_desc: "Sinn Féin, de Valera's lackeys, crypto-syndicalist Labour... all of these parties have shown us the failure of so-called liberal democracy. Our republic must be maintained, with all syndicalism rooted out, and if this gets in the way of \"reforms\" and \"rights\", so be it."
 IRE_dem_conscription_focus: "In the Name of the Republic"
 IRE_dem_conscription_focus_desc: "If we wish to protect our republic, we must maximise the amount of soldiers we are able to bring to bear in defending it. A well armed conscript army has long been shown to be an effective tool for deterring invaders, as well as ensuring a significant amount of the population has some military training."
 IRE_FOP_volunteers_desc: "Naming themselves after Bernardo O'Higgins, a descendant of Irish nobility who became the most important leader of Chile's struggle for independence, a brigade of volunteers has been formed to aid Chile and the Patagonian Workers Front in their struggle against the Buenos Aires government."
